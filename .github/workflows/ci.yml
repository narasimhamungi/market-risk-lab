name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mdl
          POSTGRES_PASSWORD: mdl_local_dev
          POSTGRES_DB: marketdata_lakehouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mdl -d marketdata_lakehouse_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      MDL_DB_NAME: marketdata_lakehouse_test
      MRL_REQUIRE_DB: "1"   # integration tests must run here, not skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pytest -q
