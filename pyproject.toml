[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-risk-lab"
version = "0.1.0"
description = "Vectorised VaR/ES with backtesting on the marketdata-lakehouse gold layer"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "psycopg2-binary", "PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_risk_lab = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a Postgres test database (MDL_DB_NAME must end in _test)"]
